<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Queue Player test page</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px;
        color: #1c1c1e;
      }
      li {
        margin: 6px 0;
      }
      button {
        padding: 6px 10px;
        margin-right: 8px;
      }
      code {
        background: #f0f0f3;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Queue Player test page</h1>
    <p>
      Five generated tones, one per <code>&lt;audio&gt;</code> element. Open the queue panel with the
      <strong>♪</strong> button in the bottom right corner and press play.
    </p>

    <ul id="list"></ul>

    <h2>Reused player element</h2>
    <p>
      One <code>&lt;audio&gt;</code> element that swaps its <code>src</code>, like a real site player.
      Each new <code>src</code> shows up as a new queue entry.
    </p>
    <button id="swap">Start src swapping</button>
    <button id="stop">Stop</button>
    <audio id="reuse" data-title="Reused element track"></audio>

    <script>
      function tone(freq, seconds = 2) {
        const rate = 8000;
        const count = rate * seconds;
        const buffer = new ArrayBuffer(44 + count * 2);
        const view = new DataView(buffer);
        const write = (offset, text) => {
          for (let i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i));
        };
        write(0, 'RIFF');
        view.setUint32(4, 36 + count * 2, true);
        write(8, 'WAVE');
        write(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, rate, true);
        view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        write(36, 'data');
        view.setUint32(40, count * 2, true);
        for (let i = 0; i < count; i += 1) {
          const sample = Math.sin((2 * Math.PI * freq * i) / rate) * 0.25 * 32767;
          view.setInt16(44 + i * 2, sample, true);
        }
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
        return `data:audio/wav;base64,${btoa(binary)}`;
      }

      const freqs = [262, 330, 392, 440, 523];
      const list = document.getElementById('list');
      freqs.forEach((freq, index) => {
        const item = document.createElement('li');
        const audio = document.createElement('audio');
        audio.setAttribute('data-title', `Tone ${index + 1} (${freq} Hz)`);
        audio.src = tone(freq);
        item.append(audio, document.createTextNode(` Tone ${index + 1} (${freq} Hz)`));
        list.append(item);
      });

      const reuse = document.getElementById('reuse');
      let swapTimer = null;
      let swapIndex = 0;
      reuse.src = tone(freqs[0], 1);
      document.getElementById('swap').addEventListener('click', () => {
        if (swapTimer) return;
        swapTimer = setInterval(() => {
          swapIndex = (swapIndex + 1) % freqs.length;
          reuse.setAttribute('data-title', `Swapped track ${swapIndex + 1}`);
          reuse.src = tone(freqs[swapIndex], 1);
        }, 2500);
      });
      document.getElementById('stop').addEventListener('click', () => {
        clearInterval(swapTimer);
        swapTimer = null;
      });
    </script>
  </body>
</html>
