<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shared site player</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px;
        color: #1c1c1e;
      }
      li {
        margin: 6px 0;
      }
      .playing {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Shared site player</h1>
    <p>
      One <code>&lt;audio&gt;</code> element reused for every track, site advances on
      <code>ended</code>. This is what most real music sites do.
    </p>
    <p>Now playing: <span id="now">nothing</span></p>
    <button id="next">Next track</button>
    <ul id="list"></ul>
    <audio id="site-audio"></audio>

    <script>
      function tone(freq, seconds = 2) {
        const rate = 8000;
        const count = rate * seconds;
        const buffer = new ArrayBuffer(44 + count * 2);
        const view = new DataView(buffer);
        const write = (offset, text) => {
          for (let i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i));
        };
        write(0, 'RIFF');
        view.setUint32(4, 36 + count * 2, true);
        write(8, 'WAVE');
        write(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, rate, true);
        view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        write(36, 'data');
        view.setUint32(40, count * 2, true);
        for (let i = 0; i < count; i += 1) {
          const sample = Math.sin((2 * Math.PI * freq * i) / rate) * 0.25 * 32767;
          view.setInt16(44 + i * 2, sample, true);
        }
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
        return `data:audio/wav;base64,${btoa(binary)}`;
      }

      const freqs = [262, 330, 392, 440, 523];
      const names = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo'];
      const audio = document.getElementById('site-audio');
      const list = document.getElementById('list');
      const now = document.getElementById('now');
      let index = -1;

      freqs.forEach((freq, i) => {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.textContent = `Play ${names[i]}`;
        button.addEventListener('click', () => play(i));
        item.append(button, document.createTextNode(` ${names[i]}`));
        list.append(item);
      });

      function play(i) {
        index = i;
        audio.src = tone(freqs[i], 2);
        now.textContent = names[i];
        [...list.children].forEach((li, n) => li.classList.toggle('playing', n === i));
        audio.play().catch(() => {});
      }

      // Real sites advance on ended, asynchronously
      audio.addEventListener('ended', () => {
        setTimeout(() => {
          if (index + 1 < freqs.length) play(index + 1);
        }, 50);
      });

      document.getElementById('next').addEventListener('click', () => {
        play((index + 1) % freqs.length);
      });
    </script>
  </body>
</html>
